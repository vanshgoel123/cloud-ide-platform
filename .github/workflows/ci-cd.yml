name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one deployment at a time; cancel in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Lint & Test
# Runs on the self-hosted VM (lightweight; no Docker daemon needed).
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint-and-test:
    name: "Lint and Test"
    runs-on: self-hosted

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────────────────
      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: "Install API dependencies + dev tools"
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install ruff pytest

      # ── Ruff lint ─────────────────────────────────────────────────────────
      - name: "Ruff lint check"
        run: ruff check api/ tests/

      - name: "Ruff format check"
        run: ruff format --check api/ tests/

      # ── Pytest ────────────────────────────────────────────────────────────
      - name: "Run pytest"
        run: pytest tests/ -v --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Docker Build
  # Runs only on pushes to main (not on PRs) and only after lint+test passes.
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build"
    runs-on: self-hosted
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Build API image"
        run: |
          docker build \
            --tag cloudide-api:${{ github.sha }} \
            --tag cloudide-api:latest \
            ./api

      - name: "Build Frontend image"
        run: |
          docker build \
            --tag cloudide-frontend:${{ github.sha }} \
            --tag cloudide-frontend:latest \
            ./frontend

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy
  # .env already exists on the VM — just bring compose up with the freshly
  # built images from the previous job.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy"
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: "docker compose up"
        working-directory: /home/vansh/cloud-ide-platform
        run: docker compose up -d --remove-orphans
