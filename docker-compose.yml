services:

  # ── API (FastAPI + Docker SDK) ───────────────────────────────────────────
  api:
    build: ./api
    container_name: cloudide-api
    user: root           # needed to talk to /var/run/docker.sock
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"   # only for direct debug access; Nginx proxies /api/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # DinD socket
      - api-data:/data                              # SQLite persistence
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - VS_IMAGE=${VS_IMAGE:-codercom/code-server:latest}
      - VS_CPU_LIMIT=${VS_CPU_LIMIT:-0.5}
      - VS_MEM_LIMIT=${VS_MEM_LIMIT:-512m}
      - VS_IDLE_TIMEOUT_MIN=${VS_IDLE_TIMEOUT_MIN:-30}
      # NOTE: VS_PASSWORD is no longer used — each workspace uses its own
      #       token (returned once at creation) as the code-server password.
      - API_KEY=${API_KEY:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - RATE_LIMIT_WINDOW_SEC=${RATE_LIMIT_WINDOW_SEC:-60}
      - RATE_LIMIT_CREATE_PER_WINDOW=${RATE_LIMIT_CREATE_PER_WINDOW:-5}
      - DB_PATH=/data/workspaces.db
      - DOCKER_NETWORK=cloudide_net
    networks:
      - cloudide_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Nginx — static files + reverse proxy) ─────────────────────
  frontend:
    build: ./frontend
    container_name: cloudide-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cloudide_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── No per-workspace port mappings needed ────────────────────────────────
  # Each code-server container is reachable from Nginx by its container name
  # (vs-{id}) on port 8080 inside cloudide_net.  The public path is:
  #
  #   http(s)://<DOMAIN>/ws/<id>/
  #
  # No host port ranges need to be opened.

networks:
  cloudide_net:
    name: cloudide_net
    driver: bridge

volumes:
  api-data:
    # Persists the SQLite database across API container restarts.
