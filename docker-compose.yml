services:
  api:
    build: ./api
    container_name: cloudide-api
    user: root
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   
      - api-data:/data                              
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - VS_IMAGE=${VS_IMAGE:-codercom/code-server:latest}
      - VS_CPU_LIMIT=${VS_CPU_LIMIT:-0.5}
      - VS_MEM_LIMIT=${VS_MEM_LIMIT:-512m}
      - VS_IDLE_TIMEOUT_MIN=${VS_IDLE_TIMEOUT_MIN:-30}
      - VS_PASSWORD=${VS_PASSWORD:-devpass123}
      - API_KEY=${API_KEY:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - RATE_LIMIT_WINDOW_SEC=${RATE_LIMIT_WINDOW_SEC:-60}
      - RATE_LIMIT_CREATE_PER_WINDOW=${RATE_LIMIT_CREATE_PER_WINDOW:-5}
      - DB_PATH=/data/workspaces.db
      - DOCKER_NETWORK=cloudide_net
    networks:
      - cloudide_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: cloudide-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cloudide_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  cloudide_net:
    name: cloudide_net
    driver: bridge

volumes:
  api-data:
