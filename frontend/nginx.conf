map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options  "nosniff"       always;
  add_header X-Frame-Options         "SAMEORIGIN"    always;
  add_header Referrer-Policy         "no-referrer"   always;
  add_header X-XSS-Protection        "1; mode=block" always;

  # ── Nginx health check (no API round-trip) ──────────────────────────────
  location = /health {
    default_type application/json;
    return 200 '{"ok":true}';
  }

  # ── Backend API ─────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ── FastAPI docs / metrics ──────────────────────────────────────────────
  location /docs {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /openapi.json {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /metrics {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ── code-server workspaces via path-based routing ───────────────────────
  # Each workspace is accessible at /ws/{vs_id}/
  # Nginx strips the prefix and proxies to the container by name on port 8080.
  # The container is on the same Docker network (cloudide_net) so
  # "vs-{vs_id}" resolves via Docker's internal DNS (127.0.0.11).
  #
  # WebSocket upgrade is forwarded so the terminal / file-watcher works.
  location ~ ^/ws/([a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9])(/.*)?$ {
    set $vs_id   $1;
    set $vs_path $2;

    # Docker's embedded DNS — required for dynamic upstream resolution by name
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream "http://vs-${vs_id}:8080";

    # code-server needs to know the public base path so it can build
    # correct asset URLs.  We pass it via the Forwarded / prefix headers.
    proxy_pass         $upstream$vs_path$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # WebSocket support (terminal, LiveShare, extension host, …)
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    # Increase timeouts for long-running IDE sessions
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # Let code-server handle its own redirects
    proxy_redirect     off;

    # Buffer tweaks for large payloads (extension downloads, file uploads)
    proxy_buffering    off;
    client_max_body_size 256m;
  }

  # ── SPA fallback ────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
